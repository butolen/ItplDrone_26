name: droneforge-db

services:
  mongodb:
    build: .
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: droneforge
    volumes:
      - droneforge-mongodb-data:/data/db

volumes:
  droneforge-mongodb-data:
